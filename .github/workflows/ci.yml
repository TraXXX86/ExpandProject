name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend Tests (Maven + Neo4j)
    runs-on: ubuntu-latest
    env:
      CI_NEO4J_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_NEO4J_AUTH: neo4j/ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      neo4j:
        image: neo4j:5.17.0
        env:
          NEO4J_AUTH: ${{ env.CI_NEO4J_AUTH }}
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -a bolt://localhost:7687 -u neo4j -p ${{ env.CI_NEO4J_PASSWORD }} 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        run: ./run-tests.sh
        env:
          NEO4J_AUTH: ${{ env.CI_NEO4J_AUTH }}
          NEO4J_BOLT_URI: bolt://localhost:7687
          NEO4J_HTTP_URI: jdbc:neo4j:http://localhost:7474

  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
