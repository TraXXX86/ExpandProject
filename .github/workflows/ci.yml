name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend unit tests
        run: ./mvnw test

  backend-integration:
    name: Backend Neo4j integration tests
    runs-on: ubuntu-latest
    needs: backend-unit
    services:
      neo4j:
        image: neo4j:5.26.31
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "neo4j-admin server status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
    env:
      NEO4J_BOLT_URI: bolt://localhost:7687
      NEO4J_AUTH: neo4j/ci-neo4j-password
      EXPAND_ADMIN_PASSWORD: ci-admin-password
      ACCESS_DB_PATH: /tmp/expandproject-ci-access.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Neo4j connector and integration tests
        run: ./mvnw -pl importdata -am verify
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install browser test dependencies
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start API for browser integration tests
        env:
          EXPAND_COOKIE_SECURE: 'false'
          EXPAND_ALLOWED_ORIGINS: http://127.0.0.1:15173
        run: |
          java -jar importdata/target/expandproject-importdata.jar --api 18080 > /tmp/expandproject-e2e-api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18080/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/expandproject-e2e-api.log
          exit 1
      - name: Test browser login, imports, data creation, search and relation CRUD
        working-directory: ui
        env:
          E2E_API_URL: http://127.0.0.1:18080
          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_PASSWORD: ci-admin-password
        run: npm run test:e2e
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-traces
          path: ui/test-results

  frontend:
    name: Frontend audit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
      - name: Build frontend
        run: npm run build
