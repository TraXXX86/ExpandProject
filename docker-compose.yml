version: "3.9"

services:
  neo4j:
    image: neo4j:5.17.0
    hostname: neo4j
    environment:
      NEO4J_AUTH: neo4j/expand123456
      NEO4J_dbms_default__listen__address: 0.0.0.0
      NEO4J_dbms_default__advertised__address: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  api:
    build:
      context: .
      dockerfile: importdata/Dockerfile
    environment:
      NEO4J_BOLT_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j/expand123456
    ports:
      - "8080:8080"
    depends_on:
      - neo4j
    restart: on-failure

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        VITE_API_BASE: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  neo4j_data:
