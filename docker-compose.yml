services:
  neo4j:
    image: neo4j:5.26.31
    hostname: neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH in .env}
      NEO4J_dbms_default__listen__address: 0.0.0.0
      NEO4J_dbms_default__advertised__address: neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j-admin", "server", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    image: expandproject-api:local
    build:
      context: .
      dockerfile: importdata/Dockerfile
    environment:
      NEO4J_BOLT_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH in .env}
      EXPAND_ADMIN_PASSWORD: ${EXPAND_ADMIN_PASSWORD:?Set EXPAND_ADMIN_PASSWORD in .env}
      ACCESS_DB_PATH: /data/access.sqlite
      EXPAND_ALLOWED_ORIGINS: ${EXPAND_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      EXPAND_COOKIE_SECURE: ${EXPAND_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - access_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health?deep=true"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ui:
    image: expandproject-ui:local
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        VITE_API_BASE: ""
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4j_data:
  access_data:
